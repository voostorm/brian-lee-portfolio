name: Remove obsolete portfolio contact

on:
  push:
    paths:
      - .github/workflows/remove-obsolete-contact.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete gaming email
        run: |
          python - <<'PY'
          from pathlib import Path

          needle = '<p class="contact-note">For game-related inquiries: <a href="mailto:voostorm.gaming@gmail.com">voostorm.gaming@gmail.com</a></p>'
          changed = []
          for name in ('index.html', 'scripts/build.py'):
              path = Path(name)
              text = path.read_text()
              if needle in text:
                  path.write_text(text.replace(needle, ''))
                  changed.append(name)
          print('Updated:', ', '.join(changed) if changed else 'nothing')
          PY
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo "No cleanup needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/build.py
          git commit -m "Remove obsolete gaming contact email"
          git push
