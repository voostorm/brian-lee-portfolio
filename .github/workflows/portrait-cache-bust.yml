name: Bust portrait asset cache

on:
  push:
    paths:
      - .github/workflows/portrait-cache-bust.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version portrait assets
        run: |
          python - <<'PY'
          from pathlib import Path

          version = '20260913-portrait2'

          p = Path('index.html')
          text = p.read_text()
          text = text.replace('href="assets/style.css"', f'href="assets/style.css?v={version}"')
          text = text.replace('src="brian_face.jpeg" alt="Brian Lee" width="112" height="112" loading="lazy"', f'src="brian_face.jpeg?v={version}" alt="Brian Lee" width="112" height="112" loading="lazy"')
          p.write_text(text)

          p = Path('scripts/build.py')
          text = p.read_text()
          text = text.replace('href="{prefix}assets/style.css"', f'href="{{prefix}}assets/style.css?v={version}"')
          text = text.replace('src="brian_face.jpeg" alt="Brian Lee" width="112" height="112" loading="lazy"', f'src="brian_face.jpeg?v={version}" alt="Brian Lee" width="112" height="112" loading="lazy"')
          p.write_text(text)
          PY
      - name: Commit cache bust
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/build.py
          git commit -m "Bust cached portrait assets"
          git push
