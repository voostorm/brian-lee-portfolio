name: Update portfolio portrait styling

on:
  push:
    paths:
      - .github/workflows/portrait-style-update.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make portrait larger and full color
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'assets/style.css': [
                  (
                      '.portrait img{width:58px;height:66px;object-fit:cover;border-radius:5px;filter:grayscale(100%)}',
                      '.portrait img{width:112px;height:112px;object-fit:cover;border-radius:8px;filter:none}'
                  )
              ],
              'index.html': [
                  (
                      '<img src="brian_face.jpeg" alt="Brian Lee" width="80" height="80" loading="lazy">',
                      '<img src="brian_face.jpeg" alt="Brian Lee" width="112" height="112" loading="lazy">'
                  )
              ],
              'scripts/build.py': [
                  (
                      '<img src="brian_face.jpeg" alt="Brian Lee" width="80" height="80" loading="lazy">',
                      '<img src="brian_face.jpeg" alt="Brian Lee" width="112" height="112" loading="lazy">'
                  )
              ],
          }

          changed = []
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              original = text
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {filename}: {old}')
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text)
                  changed.append(filename)
          print('Updated:', ', '.join(changed))
          PY
      - name: Commit portrait styling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/style.css index.html scripts/build.py
          git commit -m "Make portrait larger and full color"
          git push
